name: Hybrid Android checks

on:
  push:
    branches: ["zapia/hybrid-integration"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android API 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Run focused screen safety tests
        run: >-
          ./gradlew --no-daemon :app:testDebugUnitTest
          --tests com.past9.phoneaos.ScreenBlocklistTest
          --tests com.past9.phoneaos.ScreenSessionTest.aBankingAppIsRefusedOnEveryWayIn
          --tests com.past9.phoneaos.ScreenSessionTest.aSendAsksFirstAndADeclineOrNoAnswerSendsNothing
          --tests com.past9.phoneaos.ScreenSessionTest.submittingTypedTextAndPressingABareSpotAskToo
          --tests com.past9.phoneaos.ScreenSessionTest.stopWinsAtOnceAndOnlyThePersonCanLiftIt
          --tests com.past9.phoneaos.ScreenSessionTest.optedInWalletCanBeOpenedAndInspectedButNeverOperatedByTheAgent
          --tests com.past9.phoneaos.ScreenSessionTest.optedInBinanceCanBeOpenedAndReadButNotOperatedByTheAgent
      - name: Print exact safety-test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          failures = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for node in list(case):
                      if node.tag in ('failure', 'error'):
                          failures += 1
                          print(f"{case.attrib.get('classname')}.{case.attrib.get('name')}: {node.attrib.get('message', '')}")
                          if node.text: print(node.text[:1800] + "\n...\n" + node.text[-900:])
          print(f"Safety test failures reported: {failures}")
          PY
