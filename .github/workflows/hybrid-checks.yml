name: Hybrid Android checks

on:
  push:
    branches: ["zapia/hybrid-integration"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android API 37 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Run background screen session tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.past9.phoneaos.ScreenSessionTest
      - name: Print concise screen test failures
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')
          failures = 0
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  for node in list(case):
                      if node.tag in ('failure', 'error'):
                          failures += 1
                          print(f"{case.attrib.get('classname')}.{case.attrib.get('name')}: {node.attrib.get('message', '')}")
                          if node.text: print(node.text[-1800:])
          print(f"Screen test failures reported: {failures}")
          PY
